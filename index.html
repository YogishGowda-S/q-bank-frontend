<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QBank Answer Generator</title>
<style>
:root { --primary:#4f46e5; --primary-dark:#4338ca; --bg:#f3f4f6; --card:#ffffff; --text:#1f2937; --muted:#6b7280; --border:#e5e7eb; --danger:#dc2626; }
* { box-sizing: border-box; }
body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background:var(--bg); color:var(--text); line-height:1.5; }
.page { display:none; }
.page.active { display:block; }
.container { max-width:820px; margin:0 auto; padding:16px; }
.card { background:var(--card); border-radius:12px; padding:20px; box-shadow:0 1px 4px rgba(0,0,0,.08); }
h1 { font-size:1.5rem; margin:0 0 4px; }
h2 { font-size:1.25rem; margin:0 0 14px; }
.muted { color:var(--muted); font-size:.9rem; }
form { display:flex; flex-direction:column; gap:10px; }
label { font-weight:600; margin-top:6px; }
input[type=text], input[type=email], input[type=password], select, input[type=file] {
  width:100%; padding:12px; border:1px solid var(--border); border-radius:8px; font-size:16px; background:#fff;
}
.btn { padding:12px 16px; border:0; border-radius:8px; background:var(--primary); color:#fff; font-size:15px; cursor:pointer; }
.btn:hover { background:var(--primary-dark); }
.btn:disabled { opacity:.5; cursor:not-allowed; }
.btn.secondary { background:#6b7280; }
.btn.danger { background:var(--danger); }
.btn-row { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0; }
.link { color:var(--primary); cursor:pointer; text-decoration:underline; }
.center { text-align:center; margin-top:14px; }
.subject-item { padding:14px; background:#f9fafb; border:1px solid var(--border); border-radius:8px; margin:8px 0; cursor:pointer; font-weight:600; }
.subject-item:hover { background:#eef2ff; }
.banner { display:none; background:#fef3c7; color:#92400e; padding:10px 16px; text-align:center; font-size:.9rem; }
.status { background:#eef2ff; color:#3730a3; padding:10px 12px; border-radius:8px; margin:10px 0; display:none; font-size:.95rem; }
.status.show { display:block; }
.qa { border-left:4px solid var(--primary); background:#f9fafb; border-radius:8px; padding:12px 14px; margin:12px 0; }
.qa .q { font-weight:600; white-space:pre-wrap; }
.badge { display:inline-block; background:var(--primary); color:#fff; border-radius:999px; font-size:.75rem; padding:2px 10px; margin-left:6px; white-space:nowrap; }
.answer { margin-top:8px; overflow-x:auto; word-break:break-word; }
.answer table { border-collapse:collapse; margin:8px 0; }
.answer th, .answer td { border:1px solid #cbd5e1; padding:6px 8px; text-align:left; }
</style>
</head>
<body>

<div id="banner" class="banner"></div>

<!-- LOGIN -->
<div id="loginPage" class="page">
  <div class="container"><div class="card">
    <h1>QBank Answer Generator</h1>
    <p class="muted">Upload a question bank and your notes, get exam-ready answers.</p>
    <h2>Login</h2>
    <form id="loginForm">
      <input type="email" id="loginEmail" placeholder="Email" required autocomplete="email">
      <input type="password" id="loginPassword" placeholder="Password" required autocomplete="current-password">
      <button type="submit" class="btn">Login</button>
    </form>
    <p class="center">No account? <span class="link" onclick="showPage('signupPage')">Sign up</span></p>
  </div></div>
</div>

<!-- SIGNUP -->
<div id="signupPage" class="page">
  <div class="container"><div class="card">
    <h1>QBank Answer Generator</h1>
    <h2>Create account</h2>
    <form id="signupForm">
      <input type="email" id="signupEmail" placeholder="Email" required autocomplete="email">
      <input type="password" id="signupPassword" placeholder="Password" required autocomplete="new-password">
      <button type="submit" class="btn">Sign up</button>
    </form>
    <p class="center">Already have an account? <span class="link" onclick="showPage('loginPage')">Login</span></p>
  </div></div>
</div>

<!-- DASHBOARD -->
<div id="dashboardPage" class="page">
  <div class="container"><div class="card">
    <h2>Your subjects</h2>
    <div class="btn-row">
      <button class="btn" onclick="showPage('addSubjectPage')">+ Add subject</button>
      <button class="btn danger" onclick="logout()">Logout</button>
    </div>
    <div id="subjectsList"></div>
  </div></div>
</div>

<!-- ADD SUBJECT -->
<div id="addSubjectPage" class="page">
  <div class="container"><div class="card">
    <h2>Add subject</h2>
    <form id="addSubjectForm">
      <input type="text" id="subjectName" placeholder="Subject name (e.g. DBMS)" required maxlength="120">
      <button type="submit" class="btn">Create subject</button>
      <button type="button" class="btn secondary" onclick="goDashboard()">Back</button>
    </form>
  </div></div>
</div>

<!-- SUBJECT -->
<div id="subjectPage" class="page">
  <div class="container"><div class="card">
    <h2 id="subjectTitle"></h2>
    <div id="notesInfo" class="muted"></div>
    <div class="btn-row">
      <button class="btn secondary" onclick="goDashboard()">Back</button>
      <button class="btn" onclick="showPage('uploadPage')">Upload files</button>
      <button class="btn" id="genMissingBtn" onclick="generateMissing()">Generate missing answers</button>
      <button class="btn" id="stopBtn" onclick="stopGeneration()" style="display:none">Stop</button>
      <button class="btn" onclick="downloadPDF()">Download PDF</button>
    </div>
    <div id="genStatus" class="status"></div>
    <div id="qaList"></div>
  </div></div>
</div>

<!-- UPLOAD -->
<div id="uploadPage" class="page">
  <div class="container"><div class="card">
    <h2>Upload files</h2>
    <form id="uploadForm">
      <label for="qbankFile">Question bank (.docx)</label>
      <input type="file" id="qbankFile" required
             accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document">

      <label for="notesFile">Notes (.pdf) - you can pick several</label>
      <input type="file" id="notesFile" multiple accept=".pdf,application/pdf">

      <label for="defaultMarks">Marks to use when a question does not mention marks</label>
      <select id="defaultMarks">
        <option value="2">2 marks (short answer)</option>
        <option value="5">5 marks (medium answer)</option>
        <option value="10" selected>10 marks (long answer)</option>
      </select>

      <button type="submit" class="btn" id="uploadBtn">Upload and generate</button>
      <button type="button" class="btn secondary" onclick="showPage('subjectPage')">Back</button>
    </form>
    <div id="uploadStatus" class="status"></div>
  </div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
const API_URL = "https://q-bank-backend.onrender.com";

const $ = (id) => document.getElementById(id);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const state = {
  userId: localStorage.getItem("userId"),
  subjectId: localStorage.getItem("subjectId"),
  subjectName: localStorage.getItem("subjectName") || "",
  questions: [],
  notesCount: 0,
  busy: false,
  stop: false,
};

function showPage(id) {
  document.querySelectorAll(".page").forEach((p) => p.classList.remove("active"));
  $(id).classList.add("active");
  window.scrollTo(0, 0);
}

function setBanner(msg) {
  const b = $("banner");
  b.textContent = msg;
  b.style.display = msg ? "block" : "none";
}

function setStatus(id, msg) {
  const el = $(id);
  el.textContent = msg;
  el.classList.toggle("show", !!msg);
}

// Render's free tier sleeps when idle. Wake it up as soon as the page opens.
async function wakeServer() {
  setBanner("Waking up the server... the first load can take up to a minute.");
  for (let i = 0; i < 6; i++) {
    try {
      const r = await fetch(API_URL + "/health");
      if (r.ok) { setBanner(""); return true; }
    } catch (e) { /* retry */ }
    await sleep(5000);
  }
  setBanner("The server is not responding. Please refresh the page and try again.");
  return false;
}

// fetch wrapper: JSON in/out, readable errors, retries only on network failures and 502/503/504.
async function api(path, options = {}, retries = 2) {
  for (let i = 0; i <= retries; i++) {
    try {
      const res = await fetch(API_URL + path, options);
      let data = null;
      try { data = await res.json(); } catch (e) { /* not JSON */ }
      if (!res.ok) {
        const err = new Error((data && data.error) || "Server error (" + res.status + ")");
        err.status = res.status;
        throw err;
      }
      return data;
    } catch (err) {
      const retriable = !err.status || [502, 503, 504].includes(err.status);
      if (!retriable) throw err;
      if (i === retries) {
        throw new Error(err.status ? err.message : "Cannot reach the server. Check your internet and try again.");
      }
      await sleep(4000);
    }
  }
}

const postJSON = (path, body, retries) =>
  api(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) },
      retries === undefined ? 2 : retries);

// ───────── PDF reading (done in the browser so the free server is not overloaded) ─────────
async function extractPdfText(file, onPage) {
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  const total = Math.min(pdf.numPages, 150);
  const pages = [];
  for (let p = 1; p <= total; p++) {
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();
    const lines = [];
    let line = "", lastY = null;
    for (const item of content.items) {
      const y = item.transform ? item.transform[5] : null;
      if (lastY !== null && y !== null && Math.abs(y - lastY) > 2) { lines.push(line); line = ""; }
      line += item.str + " ";
      if (y !== null) lastY = y;
    }
    lines.push(line);
    pages.push(lines.join("\n"));
    page.cleanup();
    if (onPage) onPage(p, total);
  }
  return pages.join("\n\n");
}

async function uploadNotesFile(file, index, total) {
  const label = "Reading notes " + (index + 1) + " of " + total + ": " + file.name;
  const reset = index === 0;
  setStatus("uploadStatus", label);
  if (window.pdfjsLib) {
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    const text = await extractPdfText(file, (p, n) =>
      setStatus("uploadStatus", label + " (page " + p + " of " + n + ")"));
    setStatus("uploadStatus", label + " - saving...");
    const r = await postJSON("/api/subjects/" + state.subjectId + "/notes_text",
                             { source: file.name, text: text, reset: reset }, 1);
    return r.chars;
  }
  // Fallback: let the server read the PDF
  const nfd = new FormData();
  nfd.append("notes", file);
  nfd.append("reset", reset ? "true" : "false");
  const r = await api("/api/subjects/" + state.subjectId + "/notes", { method: "POST", body: nfd }, 0);
  return r.chars;
}

// ───────── auth ─────────
$("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  try {
    const data = await postJSON("/api/login", { email: $("loginEmail").value, password: $("loginPassword").value });
    state.userId = String(data.user_id);
    localStorage.setItem("userId", state.userId);
    goDashboard();
  } catch (err) { alert(err.message); }
});

$("signupForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  try {
    await postJSON("/api/signup", { email: $("signupEmail").value, password: $("signupPassword").value });
    alert("Signup successful! Please login.");
    showPage("loginPage");
  } catch (err) { alert(err.message); }
});

function logout() {
  ["userId", "subjectId", "subjectName"].forEach((k) => localStorage.removeItem(k));
  state.userId = null;
  showPage("loginPage");
}

// ───────── subjects ─────────
async function goDashboard() {
  showPage("dashboardPage");
  $("subjectsList").innerHTML = '<p class="muted">Loading...</p>';
  try {
    const data = await api("/api/subjects?user_id=" + encodeURIComponent(state.userId));
    $("subjectsList").innerHTML = data.subjects.length
      ? data.subjects.map((s) =>
          '<div class="subject-item" onclick="openSubject(' + s.id + ')">' + esc(s.name) + "</div>").join("")
      : '<p class="muted">No subjects yet. Add one to get started.</p>';
  } catch (err) {
    $("subjectsList").innerHTML = '<p class="muted">' + esc(err.message) + "</p>";
  }
}

$("addSubjectForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  try {
    await postJSON("/api/subjects", { user_id: state.userId, name: $("subjectName").value });
    $("subjectName").value = "";
    goDashboard();
  } catch (err) { alert(err.message); }
});

async function openSubject(id) {
  state.subjectId = String(id);
  localStorage.setItem("subjectId", state.subjectId);
  setStatus("genStatus", "");
  showPage("subjectPage");
  await refreshSubject();
}

async function refreshSubject() {
  try {
    const data = await api("/api/subjects/" + state.subjectId);
    state.subjectName = data.subject.name;
    localStorage.setItem("subjectName", state.subjectName);
    state.questions = data.qa_pairs;
    state.notesCount = data.notes_count;
    $("subjectTitle").textContent = state.subjectName;
    $("notesInfo").textContent = state.notesCount
      ? "Notes loaded (" + state.notesCount + " sections)"
      : "No notes uploaded yet. Answers will use general knowledge.";
    renderQA();
  } catch (err) {
    $("qaList").innerHTML = '<p class="muted">' + esc(err.message) + "</p>";
  }
}

function renderQA() {
  if (!state.questions.length) {
    $("qaList").innerHTML = '<p class="muted">No questions yet. Tap "Upload files" to begin.</p>';
    return;
  }
  $("qaList").innerHTML = state.questions.map((q, i) =>
    '<div class="qa"><div class="q">Q' + (i + 1) + ": " + esc(q.question_text) +
    ' <span class="badge">' + (q.marks || 10) + " marks</span></div>" +
    '<div class="answer" id="ans-' + q.id + '">' +
    (q.answer_text || '<span class="muted">Answer not generated yet</span>') + "</div></div>"
  ).join("");
}

function setAnswer(id, answerHtml) {
  const q = state.questions.find((x) => x.id === id);
  if (q) q.answer_text = answerHtml;
  const el = $("ans-" + id);
  if (el) el.innerHTML = answerHtml;
}

// ───────── upload ─────────
$("uploadForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (state.busy) return;
  const qfiles = $("qbankFile").files;
  const nfiles = $("notesFile").files;
  if (!qfiles.length) { alert("Please choose a question bank (.docx)"); return; }
  if (!nfiles.length && !state.notesCount &&
      !confirm("No notes selected. Answers will come from general knowledge. Continue?")) return;

  state.busy = true;
  $("uploadBtn").disabled = true;
  try {
    setStatus("uploadStatus", "Reading the question bank...");
    const fd = new FormData();
    for (const f of qfiles) fd.append("qbank", f);
    fd.append("default_marks", $("defaultMarks").value);
    const result = await api("/api/subjects/" + state.subjectId + "/questions", { method: "POST", body: fd });

    const warnings = [];
    for (let i = 0; i < nfiles.length; i++) {
      const chars = await uploadNotesFile(nfiles[i], i, nfiles.length);
      if (!chars) warnings.push(nfiles[i].name);
    }
    if (warnings.length) {
      alert("No readable text found in: " + warnings.join(", ") + ". Scanned PDFs (images) cannot be read.");
    }

    setStatus("uploadStatus", "");
    $("qbankFile").value = "";
    $("notesFile").value = "";
    state.busy = false;
    $("uploadBtn").disabled = false;
    showPage("subjectPage");
    await refreshSubject();
    runGeneration(result.questions.map((q) => q.id));
  } catch (err) {
    setStatus("uploadStatus", "");
    alert(err.message);
    state.busy = false;
    $("uploadBtn").disabled = false;
  }
});

// ───────── answer generation (one question per request) ─────────
async function generateOne(id) {
  for (let attempt = 0; attempt < 4; attempt++) {
    try {
      const r = await api("/api/questions/" + id + "/generate", { method: "POST" }, 0);
      return r.answer;
    } catch (err) {
      if (attempt === 3 || state.stop) return null;
      const wait = err.status === 429 ? 10000 * (attempt + 1) : 3000;
      setStatus("genStatus", (err.status === 429 ? "Rate limit reached, waiting " : "Retrying in ") +
        Math.round(wait / 1000) + "s...");
      await sleep(wait);
    }
  }
  return null;
}

function setGenerating(on) {
  state.busy = on;
  $("genMissingBtn").disabled = on;
  $("stopBtn").style.display = on ? "inline-block" : "none";
}

async function runGeneration(ids) {
  if (!ids.length) return;
  setGenerating(true);
  state.stop = false;
  let done = 0, failed = 0;
  for (const id of ids) {
    if (state.stop) break;
    setStatus("genStatus", "Generating answer " + (done + 1) + " of " + ids.length + "...");
    const answer = await generateOne(id);
    if (answer) setAnswer(id, answer); else failed++;
    done++;
  }
  setGenerating(false);
  setStatus("genStatus",
    state.stop ? "Stopped after " + done + " of " + ids.length + "."
    : failed ? "Finished. " + failed + " answer(s) failed. Tap 'Generate missing answers' to retry."
    : "All answers generated.");
}

function generateMissing() {
  const ids = state.questions.filter((q) => !q.answer_text).map((q) => q.id);
  if (!ids.length) { setStatus("genStatus", "Every question already has an answer."); return; }
  runGeneration(ids);
}

function stopGeneration() { state.stop = true; }

// ───────── PDF ─────────
async function downloadPDF() {
  try {
    setStatus("genStatus", "Preparing PDF...");
    const res = await fetch(API_URL + "/api/download/" + state.subjectId);
    if (!res.ok) {
      let msg = "Download failed";
      try { msg = (await res.json()).error || msg; } catch (e) { /* ignore */ }
      throw new Error(msg);
    }
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = (state.subjectName || "answers").replace(/[^\w\-]+/g, "_") + "_answers.pdf";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    setStatus("genStatus", "");
  } catch (err) {
    setStatus("genStatus", "");
    alert(err.message);
  }
}

// ───────── start ─────────
window.addEventListener("load", () => {
  if (state.userId) goDashboard(); else showPage("loginPage");
  wakeServer();
});
</script>
</body>
</html>
