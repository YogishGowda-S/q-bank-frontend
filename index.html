<!DOCTYPE html>
<html>
<head>
    <title>QBank</title>
    <style>
        * { margin: 0; padding: 0; }
        body { font-family: Arial; }
        .page { display: none; padding: 20px; }
        .page.active { display: block; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 5px; }
        h1 { margin-bottom: 20px; }
        input { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ddd; border-radius: 3px; }
        button { width: 100%; padding: 10px; margin: 10px 0; background: #667eea; color: white; border: none; border-radius: 3px; cursor: pointer; }
        a { color: #667eea; cursor: pointer; }
    </style>
</head>
<body>

<div id="loginPage" class="page active">
    <div class="container">
        <h1>QBank Answer Generator</h1>
        <form id="loginForm">
            <input type="email" id="loginEmail" placeholder="Email" required>
            <input type="password" id="loginPassword" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
        <p>Don't have account? <a onclick="showPage('signupPage')">Sign up</a></p>
    </div>
</div>

<div id="signupPage" class="page">
    <div class="container">
        <h1>Create Account</h1>
        <form id="signupForm">
            <input type="email" id="signupEmail" placeholder="Email" required>
            <input type="password" id="signupPassword" placeholder="Password" required>
            <button type="submit">Sign Up</button>
        </form>
        <p><a onclick="showPage('loginPage')">Back to Login</a></p>
    </div>
</div>

<div id="dashboardPage" class="page">
    <div class="container">
        <h1>Dashboard</h1>
        <button onclick="logout()">Logout</button>
        <button onclick="showPage('addSubjectPage')">+ Add Subject</button>
        <div id="subjectsList"></div>
    </div>
</div>

<div id="addSubjectPage" class="page">
    <div class="container">
        <h1>Add Subject</h1>
        <form id="addSubjectForm">
            <input type="text" id="subjectName" placeholder="Subject Name" required>
            <button type="submit">Create</button>
        </form>
        <p><a onclick="showPage('dashboardPage')">Back</a></p>
    </div>
</div>

<div id="subjectDetailPage" class="page">
    <div class="container">
        <h1 id="subjectTitle"></h1>
        <button onclick="showPage('dashboardPage')">Back</button>
        <button onclick="showPage('uploadPage')">Upload Files</button>
        <div id="qaList"></div>
    </div>
</div>

<div id="uploadPage" class="page">
    <div class="container">
        <h1>Upload Files</h1>
        <form id="uploadForm">
            <input type="file" id="qbankFile" accept=".docx" required>
            <input type="file" id="notesFile" accept=".pdf" multiple>
            <button type="submit">Upload & Generate</button>
        </form>
        <p><a onclick="showPage('subjectDetailPage')">Back</a></p>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
